services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coeval
      POSTGRES_PASSWORD: coeval
      POSTGRES_DB: coeval
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coeval -d coeval"]
      interval: 5s
      timeout: 5s
      retries: 10
