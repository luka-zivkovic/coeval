name: Release containers

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PG_SMOKE_DATABASE_URL: postgres://coeval:coeval@localhost:5432/coeval
      BETTER_AUTH_SECRET: release-test-secret-for-postgres-suite-at-least-32-bytes
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: coeval
          POSTGRES_PASSWORD: coeval
          POSTGRES_DB: coeval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coeval -d coeval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Validate self-host release bundle
        shell: bash
        env:
          COEVAL_VERSION: 0.0.0
          COEVAL_POSTGRES_PASSWORD: release-render-password
          COEVAL_AUTH_SECRET: release-render-auth-secret-at-least-32-bytes
        run: |
          (cd deploy/self-host && sha256sum -c compose.yaml.sha256)
          docker compose -f deploy/self-host/compose.yaml config --quiet

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published release tag
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/coeval-${{ matrix.image }}:${{ steps.version.outputs.value }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image" >&2
            exit 1
          fi

      - name: Build and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coeval-${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/coeval-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot and verify the published release bundle
        shell: bash
        env:
          COEVAL_VERSION: ${{ github.ref_name }}
          COEVAL_BIND_ADDRESS: 127.0.0.1
          COEVAL_PORT: 18081
          COEVAL_PUBLIC_URL: http://127.0.0.1:18081
          COEVAL_POSTGRES_PASSWORD: release-smoke-postgres
          COEVAL_AUTH_SECRET: release-smoke-auth-secret-at-least-32-bytes
          COEVAL_BOOTSTRAP_TOKEN: release-smoke-bootstrap-token
        run: |
          COEVAL_VERSION="${COEVAL_VERSION#v}"
          export COEVAL_VERSION
          project="coeval-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            if ((status != 0)); then
              docker compose --project-name "$project" -f deploy/self-host/compose.yaml logs --no-color || true
            fi
            docker compose --project-name "$project" -f deploy/self-host/compose.yaml down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml pull
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml up -d
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:18081/health >/dev/null; then
              docker compose --project-name "$project" -f deploy/self-host/compose.yaml ps
              exit 0
            fi
            sleep 2
          done
          exit 1

  draft-release:
    needs: smoke-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create operator-reviewed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --generate-notes
          --title "$GITHUB_REF_NAME"
