# Generic single-host Coeval distribution managed by trustctl.
# Operator customizations belong in compose.override.yaml; trustctl treats this
# file as release-owned and refuses to update it after local edits.
services:
  web:
    image: ghcr.io/luka-zivkovic/coeval-web:${COEVAL_VERSION:?COEVAL_VERSION is required}
    restart: unless-stopped
    ports:
      - "${COEVAL_BIND_ADDRESS:-127.0.0.1}:${COEVAL_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  api:
    image: ghcr.io/luka-zivkovic/coeval-api:${COEVAL_VERSION:?COEVAL_VERSION is required}
    restart: unless-stopped
    init: true
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://coeval:${COEVAL_POSTGRES_PASSWORD:?COEVAL_POSTGRES_PASSWORD is required}@postgres:5432/${COEVAL_POSTGRES_DB:-coeval}
      BETTER_AUTH_SECRET: ${COEVAL_AUTH_SECRET:?COEVAL_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${COEVAL_PUBLIC_URL:-http://localhost:8081}
      TRUSTED_ORIGINS: ${COEVAL_PUBLIC_URL:-http://localhost:8081}
      COEVAL_TRUST_PROXY: "1"
      COEVAL_BOOTSTRAP_TOKEN: ${COEVAL_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 18

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coeval
      POSTGRES_PASSWORD: ${COEVAL_POSTGRES_PASSWORD:?COEVAL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${COEVAL_POSTGRES_DB:-coeval}
    volumes:
      - coeval_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  coeval_postgres_data:
